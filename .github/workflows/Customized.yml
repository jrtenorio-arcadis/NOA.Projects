on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3
      # Diagnostic: Print runner user
      - name: Print runner user
        shell: powershell
        run: whoami

      # Diagnostic: Show PATH
      - name: Show PATH
        shell: powershell
        run: echo $env:PATH

      # Ensure PAC CLI is available
      - name: Add PAC CLI directory to PATH
        shell: powershell
        run: |
          $env:PATH = "C:\Tools\PowerAppsCLI;" + $env:PATH
          Write-Output "Updated PATH: $env:PATH"

      # Diagnostic: Show PAC CLI location and version
      - name: Show PAC CLI location and version
        shell: powershell
        run: |
          $pac = Get-Command pac -ErrorAction SilentlyContinue
          if ($null -eq $pac) {
            Write-Error "PAC CLI not found on PATH."
            Exit 1
          } else {
            Write-Output "PAC CLI found at: $($pac.Source)"
            & pac
          }

      # Authenticate to EPS_DEV environment
      - name: Authenticate to Power Platform Environment (EPS_DEV)
        shell: powershell
        run: |
          pac auth create --environment 'https://org160d1bc2.crm.dynamics.com' --username 'sa_svc_eps_intake@arcadis.com' --password '${{ secrets.NOA_PP_SECRET }}'

      # Export Solution (unmanaged) - remove zip if exists!
      - name: Export Solution
        shell: powershell
        run: |
          if (!(Test-Path -Path 'out')) { New-Item -ItemType Directory -Path 'out' }
          if (Test-Path -Path 'out/NOA.ReusableComponents.Solution.zip') {
              Remove-Item -Path 'out/NOA.ReusableComponents.Solution.zip' -Force
          }
          pac solution export --name 'NOAReusableComponentsSolution' --path 'out/NOA.ReusableComponents.Solution.zip'

      # Unpack Solution (unmanaged)
      - name: Unpack Solution
        shell: powershell
        run: |
          if (!(Test-Path -Path 'out/solutions/NOAReusableComponentsSolution')) { New-Item -ItemType Directory -Path 'out/solutions/NOAReusableComponentsSolution' }
          pac solution unpack --zipfile 'out/NOA.ReusableComponents.Solution.zip' --folder 'out/solutions/NOAReusableComponentsSolution' --packagetype Unmanaged --clobber

      # Prepare solution changes for check-in into source control
      - name: Prepare solution changes for check-in
        shell: powershell
        run: |
          if (!(Test-Path -Path 'src/solutions/NOAReusableComponentsSolution')) { New-Item -ItemType Directory -Path 'src/solutions/NOAReusableComponentsSolution' }
          Copy-Item -Path 'out/solutions/NOAReusableComponentsSolution\*' -Destination 'src/solutions/NOAReusableComponentsSolution' -Recurse -Force

      # 6️⃣ Branch Solution
      - name: Branch Solution
        uses: microsoft/powerplatform-actions/branch-solution@v1
        with:
          solution-folder: out/solutions/NOAReusableComponentsSolution
          solution-target-folder: src/solutions/NOAReusableComponentsSolution
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          branch-name: solution-update
          allow-empty-commit: false
          clobber-branch: false
