on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout repository (required for git operations)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Install Power Platform Tools
      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      # 3️⃣ Remove old solution zip if exists
      - name: Remove old solution zip if exists
        shell: powershell
        run: |
          if (Test-Path -Path 'out/POC.zip') {
              Remove-Item -Path 'out/POC.zip' -Force
          }

      # 4️⃣ Export Solution
      - name: Export Solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: 'https://org160d1bc2.crm.dynamics.com'   # EPS_DEV environment
          user-name: 'sa_svc_eps_intake@arcadis.com'
          password-secret: ${{ secrets.NOA_PP_SECRET }}
          solution-name: 'POC'
          solution-output-file: 'POC.zip'
          working-directory: 'out'
          managed: true

      # 5️⃣ Import Solution (optional, if you want to move to another environment)
      - name: Import Solution
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: 'https://org82c8d52d.crm.dynamics.com/'   # Target environment
          user-name: 'sa_svc_eps_intake@arcadis.com'
          password-secret: ${{ secrets.NOA_PP_SECRET }}
          solution-file: 'out/POC.zip'

      # 6️⃣ Unpack Solution
      - name: Unpack Solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: 'out/POC.zip'
          solution-folder: 'out/solutions/POC'
          solution-type: 'Managed'
          overwrite-files: true

      # 7️⃣ Commit unpacked solution to source control
      - name: Commit unpacked solution to source control
        uses: microsoft/powerplatform-actions/branch-solution@v1
        with:
          solution-folder: 'out/solutions/POC'
          solution-target-folder: 'src/solutions/POC'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          branch-name: 'main'
