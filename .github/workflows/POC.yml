on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      # Diagnostic: Print runner user
      - name: Print runner user
        shell: powershell
        run: whoami

      # Diagnostic: Show PATH
      - name: Show PATH
        shell: powershell
        run: echo $env:PATH

      # Ensure PAC CLI is available
      - name: Add PAC CLI directory to PATH
        shell: powershell
        run: |
          $env:PATH = "C:\Tools\PowerAppsCLI;" + $env:PATH
          Write-Output "Updated PATH: $env:PATH"

      # Diagnostic: Show PAC CLI location and version
      - name: Show PAC CLI location and version
        shell: powershell
        run: |
          $pac = Get-Command pac -ErrorAction SilentlyContinue
          if ($null -eq $pac) {
            Write-Error "PAC CLI not found on PATH."
            Exit 1
          } else {
            Write-Output "PAC CLI found at: $($pac.Source)"
            & pac
          }

      - name: Checkout repository
        uses: actions/checkout@v3

      # --- Fix GIT dubious ownership by marking all directories as safe ---
      - name: Mark all directories as safe for Git
        shell: powershell
        run: |
          git config --global --add safe.directory '*'
      # -------------------------------------------------------------------

      # Authenticate to EPS_DEV environment
      - name: Authenticate to Power Platform Environment (EPS_DEV)
        shell: powershell
        run: |
          pac auth create --environment 'https://org160d1bc2.crm.dynamics.com' --username 'sa_svc_eps_intake@arcadis.com' --password '${{ secrets.NOA_PP_SECRET }}'

      # Export Solution (unmanaged) - remove zip if exists!
      - name: Export Solution
        shell: powershell
        run: |
          if (!(Test-Path -Path 'out')) { New-Item -ItemType Directory -Path 'out' }
          if (Test-Path -Path 'out/NOAProjectChecklistVariablesSolution.zip') {
              Remove-Item -Path 'out/NOAProjectChecklistVariablesSolution.zip' -Force
          }
          pac solution export --name 'NOAProjectChecklistVariablesSolution' --path 'out/NOAProjectChecklistVariablesSolution.zip'

      # Unpack Solution (unmanaged)
      - name: Unpack Solution
        shell: powershell
        run: |
          if (!(Test-Path -Path 'out/solutions/NOAProjectChecklistVariablesSolution')) { New-Item -ItemType Directory -Path 'out/solutions/NOAProjectChecklistVariablesSolution' }
          pac solution unpack --zipfile 'out/NOAProjectChecklistVariablesSolution.zip' --folder 'out/solutions/NOAProjectChecklistVariablesSolution' --packagetype Unmanaged --clobber

      # Prepare solution changes for check-in into source control
      - name: Prepare solution changes for check-in
        shell: powershell
        run: |
          if (!(Test-Path -Path 'src/solutions/NOAProjectChecklistVariablesSolution')) { New-Item -ItemType Directory -Path 'src/solutions/NOAProjectChecklistVariablesSolution' }
          Copy-Item -Path 'out/solutions/NOAProjectChecklistVariablesSolution\*' -Destination 'src/solutions/NOAProjectChecklistVariablesSolution' -Recurse -Force


      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Import Solution to Production
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: 'https://org82c8d52d.crm.dynamics.com'
          user-name: 'sa_svc_eps_intake@arcadis.com'
          password-secret: ${{ secrets.NOA_PP_SECRET }}
          solution-file: 'out/solutions/NOAProjectChecklistVariablesSolution.zip'

      - name: Publish Solution in Production
        uses: microsoft/powerplatform-actions/publish-solution@v1
        with:
          environment-url: 'https://org82c8d52d.crm.dynamics.com'
          user-name: 'sa_svc_eps_intake@arcadis.com'
          password-secret: ${{ secrets.NOA_PP_SECRET }}
      
      - name: Branch Solution
        uses: microsoft/powerplatform-actions/branch-solution@v1
        with:
          solution-folder: out/solutions/NOAProjectChecklistVariablesSolution
          solution-target-folder: src/solutions/NOAProjectChecklistVariablesSolution
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          branch-name: Branch-NOAProjectChecklistVariablesSolution
          allow-empty-commit: false
          clobber-branch: true
          

      - name: Revert all Git safe.directory settings
        if: always() # Ensures this runs even if previous steps fail
        shell: powershell
        run: |
          git config --global --unset-all safe.directory
          
