on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs: 
  build:
    runs-on: self-hosted 

    steps:
      # Diagnostic: Print runner user
      - name: Print runner user
        shell: powershell
        run: whoami

      # Diagnostic: Show PATH
      - name: Show PATH
        shell: powershell
        run: echo $env:PATH

      # Ensure PAC CLI is available
      - name: Add PAC CLI directory to PATH
        shell: powershell
        run: |
          $env:PATH = "C:\Tools\PowerAppsCLI;" + $env:PATH
          Write-Output "Updated PATH: $env:PATH"

      # Diagnostic: Show PAC CLI location and version
      - name: Show PAC CLI location and version
        shell: powershell
        run: |
          $pac = Get-Command pac -ErrorAction SilentlyContinue
          if ($null -eq $pac) {
            Write-Error "PAC CLI not found on PATH."
            Exit 1
          } else {
            Write-Output "PAC CLI found at: $($pac.Source)"
            & pac
          }

      # Authenticate to Power Platform Environment
      - name: Authenticate to Power Platform Environment
        shell: powershell
        run: |
          pac auth create --url 'https://org82c8d52d.crm.dynamics.com' --username 'jerome.tenorio@arcadis.com' --password '${{ secrets.NOA_PP_SECRET }}'

      # Export Solution (managed)
      - name: Export Solution
        shell: powershell
        run: |
          # Ensure output directory exists
          if (!(Test-Path -Path 'out')) { New-Item -ItemType Directory -Path 'out' }
          pac solution export --name 'NOA.ReusableComponents.Solution' --output 'out/NOA.ReusableComponents.Solution.zip' --managed

      # Unpack Solution (managed)
      - name: Unpack Solution
        shell: powershell
        run: |
          # Ensure unpack output directory exists
          if (!(Test-Path -Path 'out/solutions/NOA.ReusableComponents.Solution')) { New-Item -ItemType Directory -Path 'out/solutions/NOA.ReusableComponents.Solution' }
          pac solution unpack --zipfile 'out/NOA.ReusableComponents.Solution.zip' --folder 'out/solutions/NOA.ReusableComponents.Solution' --type Managed --overwrite

      # Publish Solution (if needed, use PAC CLI or custom scripts)
      # PAC CLI currently does not have a direct 'publish' command for solutions.
      # If you need to import the solution back, use pac solution import command.
      # Example:
      # - name: Import Solution (Managed)
      #   shell: powershell
      #   run: |
      #     pac solution import --zipfile 'out/NOA.ReusableComponents.Solution.zip' --environment 'https://org82c8d52d.crm.dynamics.com'

      # Prepare solution changes for check-in into source control
      - name: Prepare solution changes for check-in
        shell: powershell
        run: |
          # Copy unpacked solution to the target folder for source control
          if (!(Test-Path -Path 'src/solutions/NOA.ReusableComponents.Solution')) { New-Item -ItemType Directory -Path 'src/solutions/NOA.ReusableComponents.Solution' }
          Copy-Item -Path 'out/solutions/NOA.ReusableComponents.Solution\*' -Destination 'src/solutions/NOA.ReusableComponents.Solution' -Recurse -Force
