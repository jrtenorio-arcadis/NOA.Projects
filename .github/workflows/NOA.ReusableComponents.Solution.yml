on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    env:
      TEMP: C:\Temp
      TMP: C:\Temp

    steps:
      # Print runner user (for troubleshooting)
      - name: Print runner user
        run: whoami

      # List NuGet sources (to confirm feeds)
      - name: List NuGet sources
        run: C:\Tools\NuGet\nuget.exe sources list

      # Verify write access to TEMP directory
      - name: Test write access to TEMP directory
        run: |
          echo "Power Platform Actions Test" > C:\Temp\testfile.txt
          dir C:\Temp\testfile.txt

      # Install Power Platform Tools (Microsoft.PowerApps.CLI)
      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      # List PAC CLI directory (diagnostic)
      - name: List PAC CLI directory
        run: dir C:\Temp\powerplatform-actions-*\Microsoft.PowerApps.CLI.1.43.6\tools

      # Test PAC CLI execution (diagnostic)
      - name: Test PAC CLI execution
        run: |
          $pacDirs = Get-ChildItem -Directory C:\Temp\powerplatform-actions-* | ForEach-Object { $_.FullName }
          foreach ($dir in $pacDirs) {
            $pacPath = Join-Path $dir "Microsoft.PowerApps.CLI.1.43.6\tools\pac.exe"
            if (Test-Path $pacPath) {
              & $pacPath help
            }
          }

      # Export Solution
      - name: Export Solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: 'https://org82c8d52d.crm.dynamics.com'
          user-name: 'GECSPAdmin@arcadis.com'
          password-secret: ${{ secrets.NOA_PP_SECRET }}
          solution-name: 'NOA.ReusableComponents.Solution'
          solution-output-file: 'NOA.ReusableComponents.Solution.zip'
          working-directory: 'out'
          managed: true

      # Unpack Solution
      - name: Unpack Solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: 'out/NOA.ReusableComponents.Solution.zip'
          solution-folder: 'out/solutions/NOA.ReusableComponents.Solution'
          solution-type: 'Managed'
          overwrite-files: true

      # Publish Solution
      - name: Publish Solution
        uses: microsoft/powerplatform-actions/publish-solution@v1
        with:
          environment-url: 'https://org82c8d52d.crm.dynamics.com'
          user-name: 'GECSPAdmin@arcadis.com'
          password-secret: ${{ secrets.NOA_PP_SECRET }}

      # Prepare solution changes for check-in into source control
      - name: Prepare solution changes for check-in into source control
        uses: microsoft/powerplatform-actions/branch-solution@v1
        with:
          solution-folder: 'out/solutions/NOA.ReusableComponents.Solution'
          solution-target-folder: 'src/solutions/NOA.ReusableComponents.Solution'
          token: ${{ secrets.GITHUB_TOKEN }}
