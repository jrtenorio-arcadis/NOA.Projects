on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs: 
  build:
    runs-on: self-hosted  

    steps:
      # Diagnostic: Print runner user
      - name: Print runner user
        shell: powershell
        run: whoami

      # Diagnostic: Show PATH
      - name: Show PATH
        shell: powershell
        run: echo $env:PATH

      # Ensure PAC CLI is available
      - name: Add PAC CLI directory to PATH
        shell: powershell
        run: |
          $env:PATH = "C:\Tools\PowerAppsCLI;" + $env:PATH
          Write-Output "Updated PATH: $env:PATH"

      # Diagnostic: Show PAC CLI location and version
      - name: Show PAC CLI location and version
        shell: powershell
        run: |
          $pac = Get-Command pac -ErrorAction SilentlyContinue
          if ($null -eq $pac) {
            Write-Error "PAC CLI not found on PATH."
            Exit 1
          } else {
            Write-Output "PAC CLI found at: $($pac.Source)"
            & pac
          }

      # Authenticate to Power Platform Environment
      - name: Authenticate to Power Platform Environment
        shell: powershell
        run: |
          pac auth create --url 'https://org82c8d52d.crm.dynamics.com' --username 'sa_svc_eps_intake@arcadis.com' --password '${{ secrets.NOA_PP_SECRET }}'

      # Export Solution (managed) - using correct unique name!
      - name: Export Solution
        shell: powershell
        run: |
          if (!(Test-Path -Path 'out')) { New-Item -ItemType Directory -Path 'out' }
          pac solution export --name 'noaph_noareusablecomponents_ed385' --path 'out/NOA.ReusableComponents.Solution.zip' --managed

      # Unpack Solution (managed)
      - name: Unpack Solution
        shell: powershell
        run: |
          if (!(Test-Path -Path 'out/solutions/noaph_noareusablecomponents_ed385')) { New-Item -ItemType Directory -Path 'out/solutions/noaph_noareusablecomponents_ed385' }
          pac solution unpack --zipfile 'out/NOA.ReusableComponents.Solution.zip' --folder 'out/solutions/noaph_noareusablecomponents_ed385' --type Managed --overwrite

      # Prepare solution changes for check-in into source control
      - name: Prepare solution changes for check-in
        shell: powershell
        run: |
          if (!(Test-Path -Path 'src/solutions/noaph_noareusablecomponents_ed385')) { New-Item -ItemType Directory -Path 'src/solutions/noaph_noareusablecomponents_ed385' }
          Copy-Item -Path 'out/solutions/noaph_noareusablecomponents_ed385\*' -Destination 'src/solutions/noaph_noareusablecomponents_ed385' -Recurse -Force
