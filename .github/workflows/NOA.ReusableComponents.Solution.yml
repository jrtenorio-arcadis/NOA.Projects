on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs: 
  build:
    runs-on: self-hosted

    steps:
      - run: echo "Runner is working!"
      - uses: actions/checkout@v3

      - name: Git version
        run: git --version
        shell: powershell

      - name: Show git remotes
        run: git remote -v
        shell: powershell

    
      # Diagnostic: Print runner user
      - name: Print runner user
        shell: powershell
        run: whoami

      # Diagnostic: Show PATH 
      - name: Show PATH
        shell: powershell
        run: echo $env:PATH

      # Install Power Platform Tools
      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Remove old solution zip if exists
        shell: powershell
        run: |
          if (Test-Path -Path 'out/NOA.ReusableComponents.Solution.zip') {
              Remove-Item -Path 'out/NOA.ReusableComponents.Solution.zip' -Force
          }

      # Export Solution (unmanaged)
      - name: Export Solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: 'https://org160d1bc2.crm.dynamics.com'   # EPS_DEV environment
          user-name: 'sa_svc_eps_intake@arcadis.com'
          password-secret: ${{ secrets.NOA_PP_SECRET }}
          solution-name: 'NOAReusableComponentsSolution'
          solution-output-file: 'NOA.ReusableComponents.Solution.zip'
          working-directory: 'out'
          managed: false

      # Unpack Solution (unmanaged)
      - name: Unpack Solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: 'out/NOA.ReusableComponents.Solution.zip'
          solution-folder: 'out/solutions/NOAReusableComponentsSolution'
          solution-type: 'Unmanaged'
          overwrite-files: true

      # Prepare solution changes for check-in (auto commit/push)
      - name: Prepare solution changes for check-in into source control
        uses: microsoft/powerplatform-actions/branch-solution@v1
        with:
          solution-folder: 'out/solutions/NOAReusableComponentsSolution'
          solution-target-folder: 'src/solutions/NOAReusableComponentsSolution'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
