on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted  
 
    steps:


      # Install Power Platform Tools
      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      # Remove old solution zip if exists
      - name: Remove old solution zip if exists
        shell: powershell
        run: |
          if (Test-Path -Path 'out/POC.zip') {
              Remove-Item -Path 'out/POC.zip' -Force
          }

      # Export Solution
      - name: Export Solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: 'https://org160d1bc2.crm.dynamics.com'   # EPS_DEV environment
          user-name: 'sa_svc_eps_intake@arcadis.com'
          password-secret: ${{ secrets.NOA_PP_SECRET }}
          solution-name: 'POC'
          solution-output-file: 'POC.zip'
          working-directory: 'out'
          managed: false


      - name: Publish Solution
        uses: microsoft/powerplatform-actions/publish-solution@v1
        with:
          environment-url: 'https://org160d1bc2.crm.dynamics.com/'
          user-name: 'sa_svc_eps_intake@arcadis.com'
          password-secret: ${{ secrets.NOA_PP_SECRET }}
          

      # Unpack Solution
      - name: Unpack Solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: 'out/POC.zip'
          solution-folder: 'out/solutions/POC'
          solution-type: 'Unmanaged'
          overwrite-files: true


