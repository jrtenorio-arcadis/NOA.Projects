on:
  workflow_dispatch:

jobs:
  build:

    runs-on: self-hosted   # alternate runner OS is: ubuntu-latest
    steps:

       #========================= PAC Validation & Installation ===========================
      # Diagnostic: Print runner user
      - name: Print runner user
        shell: powershell
        run: whoami

      # Diagnostic: Show PATH
      - name: Show PATH
        shell: powershell
        run: echo $env:PATH

      # Ensure PAC CLI is available
      - name: Add PAC CLI directory to PATH
        shell: powershell
        run: |
          $env:PATH = "C:\Tools\PowerAppsCLI;" + $env:PATH
          Write-Output "Updated PATH: $env:PATH"

      # Diagnostic: Show PAC CLI location and version
      - name: Show PAC CLI location and version
        shell: powershell
        run: |
          $pac = Get-Command pac -ErrorAction SilentlyContinue
          if ($null -eq $pac) {
            Write-Error "PAC CLI not found on PATH."
            Exit 1
          } else {
            Write-Output "PAC CLI found at: $($pac.Source)"
            & pac
          }

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

        # Authenticate to EPS_DEV environment
      - name: Authenticate to Power Platform Environment (EPS_DEV)
        shell: powershell
        run: |
          pac auth create --environment 'https://org160d1bc2.crm.dynamics.com' --username 'sa_svc_eps_intake@arcadis.com' --password '${{ secrets.NOA_PP_SECRET }}'

        #=================================================================================
  
      - name: Export Solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: 'https://org160d1bc2.crm.dynamics.com'
          user-name: 'sa_svc_eps_intake@arcadis.com'
          password-secret: ${{ secrets.NOA_PP_SECRET }}
          solution-name: NOAProjectChecklistVariablesSolution
          solution-output-file: 'NOAProjectChecklistVariablesSolution.zip'
          working-directory: 'out'
          managed: false
          run-asynchronously: false
          cloud: Public
          overwrite: false
        env:
          POWERPLATFORMTOOLS_PACINSTALLED: true
          POWERPLATFORMTOOLS_PACPATH: C:\Tools\PowerAppsCLI\pac.exe
  
      - name: Unpack Solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: 'out/NOAProjectChecklistVariablesSolution.zip'
          solution-folder: 'out/solutions/NOAProjectChecklistVariablesSolution'
          solution-type: 'Unmanaged'
          overwrite-files: true
  
      - name: Publish Solution
        uses: microsoft/powerplatform-actions/publish-solution@v1
        with:
          environment-url: 'https://org160d1bc2.crm.dynamics.com'
          user-name: 'sa_svc_eps_intake@arcadis.com'
          password-secret: ${{ secrets.NOA_PP_SECRET }}
  
      - name: Prepare solution changes for check-in into source control
        uses: microsoft/powerplatform-actions/branch-solution@v1
        with:
          solution-folder: 'out/solutions/NOAProjectChecklistVariablesSolution'
          solution-target-folder: 'src/solutions/NOAProjectChecklistVariablesSolution'
          token: ${{ secrets.GITHUB_TOKEN }}
