on:
  workflow_dispatch:

jobs:
  import-to-production:
    runs-on: self-hosted
    environment: PROD-POC    # Must exactly match your GitHub Environment name!
    steps:
      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Import Solution to Production
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: 'https://org6a8a6dc7.crm.dynamics.com/'
          user-name: 'sa_svc_eps_intake@arcadis.com'
          password-secret: ${{ secrets.NOA_PP_SECRET }}
          solution-file: 'out/POC.zip'

      - name: Publish Solution in Production
        uses: microsoft/powerplatform-actions/publish-solution@v1
        with:
          environment-url: 'https://org6a8a6dc7.crm.dynamics.com/'
          user-name: 'sa_svc_eps_intake@arcadis.com'
          password-secret: ${{ secrets.NOA_PP_SECRET }}
